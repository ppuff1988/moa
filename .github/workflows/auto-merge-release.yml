name: Auto Merge Release

on:
  workflow_run:
    workflows: ['CI Test']
    types: [completed]

concurrency:
  group: auto-merge-release-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  auto-merge-release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: write
      statuses: write
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'release/v')
    steps:
      - name: 等待 Codex Review 並啟用 Release 自動合併
        uses: actions/github-script@v8
        with:
          script: |
            const CODEX_BOT = 'chatgpt-codex-connector[bot]';
            const CODEX_SUMMARY_MARKER = 'codex-pull-request-review-summary';
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

            async function setCodexStatus(sha, state, description) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state,
                context: 'codex-review',
                description,
                target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/commit/${sha}`
              });
            }

            async function getPackageVersion(ref) {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'package.json',
                ref
              });
              return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8')).version;
            }

            function compareVersions(left, right) {
              const leftParts = left.split('.').map(Number);
              const rightParts = right.split('.').map(Number);
              if (
                leftParts.length !== 3 ||
                rightParts.length !== 3 ||
                [...leftParts, ...rightParts].some(Number.isNaN)
              ) {
                throw new Error(`不支援的正式版本格式: ${left} / ${right}`);
              }
              for (let index = 0; index < leftParts.length; index += 1) {
                if (leftParts[index] !== rightParts[index]) {
                  return leftParts[index] - rightParts[index];
                }
              }
              return 0;
            }

            async function validateReleaseRequest(pr) {
              if (
                pr.head.repo?.full_name !== context.payload.repository.full_name ||
                pr.author_association !== 'OWNER' ||
                pr.user?.login !== context.repo.owner
              ) {
                throw new Error(`Release PR #${pr.number} 必須由 repository owner 在目前 repository 建立`);
              }

              const requestNumber = Number(/(?:^|\n)- Request: #(\d+)(?:\n|$)/.exec(pr.body || '')?.[1]);
              if (!Number.isSafeInteger(requestNumber) || requestNumber <= 0) {
                throw new Error(`Release PR #${pr.number} 缺少有效的 release request`);
              }

              const [{ data: issue }, comments] = await Promise.all([
                github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: requestNumber
                }),
                github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: requestNumber,
                  per_page: 100
                })
              ]);
              const hasRequestLabel = issue.labels.some(
                (label) => (label.name || label) === 'release-request'
              );
              const requestMarker =
                /<!-- moa-release-request bump=(auto|patch|minor|major) run_id=(\d+) -->/.exec(
                  issue.body || ''
                );
              const expectedPreparation = `Release commit \`${pr.head.sha}\` 已準備`;
              const hasAutomationPreparation = comments.some(
                (comment) =>
                  comment.author_association === 'OWNER' &&
                  (comment.body || '').includes(expectedPreparation)
              );
              const expectedCompletion =
                `Release PR #${pr.number} 已建立：${pr.html_url}（commit \`${pr.head.sha}\`）`;
              const hasAutomationCompletion = comments.some(
                (comment) =>
                  comment.author_association === 'OWNER' &&
                  (comment.body || '').includes(expectedCompletion)
              );

              let trustedRun = false;
              if (
                issue.author_association === 'OWNER' &&
                issue.user?.login === context.repo.owner &&
                requestMarker
              ) {
                try {
                  const { data: run } = await github.rest.actions.getWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: Number(requestMarker[2])
                  });
                  trustedRun =
                    run.path === '.github/workflows/prepare-release.yml' &&
                    run.event === 'workflow_dispatch' &&
                    run.head_branch === 'main' &&
                    run.actor?.login === context.repo.owner;
                } catch (error) {
                  core.warning(`無法驗證 Release request #${requestNumber} 的 workflow run`);
                }
              }

              if (
                issue.state !== 'closed' ||
                !hasRequestLabel ||
                !trustedRun ||
                !hasAutomationPreparation ||
                !hasAutomationCompletion
              ) {
                throw new Error(`Release PR #${pr.number} 未通過 release request metadata 驗證`);
              }
            }

            async function waitForCodexReview(pr) {
              const shortSha = pr.head.sha.slice(0, 7);
              const maxAttempts = 30;
              await setCodexStatus(pr.head.sha, 'pending', `等待 Codex Review (${shortSha})`);

              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                const [issueComments, reviews, reviewComments] = await Promise.all([
                  github.paginate(github.rest.issues.listComments, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    per_page: 100
                  }),
                  github.paginate(github.rest.pulls.listReviews, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    per_page: 100
                  }),
                  github.paginate(github.rest.pulls.listReviewComments, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    per_page: 100
                  })
                ]);

                const currentReviews = reviews.filter(
                  (review) => review.user?.login === CODEX_BOT && review.commit_id === pr.head.sha
                );
                const currentReviewIds = new Set(currentReviews.map((review) => review.id));
                const findings = reviewComments.filter(
                  (comment) =>
                    comment.user?.login === CODEX_BOT &&
                    currentReviewIds.has(comment.pull_request_review_id)
                );
                const completedSummary = issueComments.some((comment) => {
                  const body = comment.body || '';
                  return (
                    comment.user?.login === CODEX_BOT &&
                    body.includes(CODEX_SUMMARY_MARKER) &&
                    body.includes('✅ **Completed**') &&
                    body.includes(`\`${shortSha}\``)
                  );
                });

                if (findings.length > 0) {
                  await setCodexStatus(pr.head.sha, 'failure', `Codex 發現 ${findings.length} 個問題`);
                  throw new Error(`Codex Review 在 commit ${shortSha} 發現問題，停止自動合併`);
                }
                if (completedSummary) {
                  await setCodexStatus(pr.head.sha, 'success', `Codex Review 通過 (${shortSha})`);
                  return;
                }

                core.info(`等待 Codex Review (${attempt}/${maxAttempts})，commit ${shortSha}`);
                if (attempt < maxAttempts) await sleep(20_000);
              }

              await setCodexStatus(pr.head.sha, 'failure', `等待 Codex Review 逾時 (${shortSha})`);
              throw new Error(`等待 Codex Review 逾時，停止自動合併 commit ${shortSha}`);
            }

            const associatedPRs = context.payload.workflow_run.pull_requests || [];
            for (const associatedPR of associatedPRs) {
              let { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: associatedPR.number
              });

              if (!pr.head.ref.startsWith('release/v') || pr.base.ref !== 'main' || pr.draft) continue;

              await validateReleaseRequest(pr);

              if (pr.head.sha !== context.payload.workflow_run.head_sha) {
                throw new Error(
                  `Release PR #${pr.number} 的目前 commit 並非觸發此流程的 CI commit`
                );
              }
              if (
                pr.base.sha !== associatedPR.base.sha ||
                pr.base.ref !== associatedPR.base.ref
              ) {
                throw new Error(
                  `Release PR #${pr.number} 的 base 已在 CI 後改變，必須以新 base 重新執行 CI`
                );
              }

              const [baseVersion, headVersion] = await Promise.all([
                getPackageVersion(pr.base.sha),
                getPackageVersion(pr.head.sha)
              ]);
              if (
                compareVersions(headVersion, baseVersion) <= 0 ||
                pr.head.ref !== `release/v${headVersion}`
              ) {
                throw new Error(`Release PR #${pr.number} 的分支與 package.json 版本不一致`);
              }

              const reviewedSha = pr.head.sha;
              const reviewedBaseSha = pr.base.sha;
              const reviewedBaseRef = pr.base.ref;
              await waitForCodexReview(pr);

              ({ data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              }));

              if (pr.head.sha !== reviewedSha) {
                throw new Error('PR 在 Codex Review 期間有新 commit，必須重新執行 CI 與 Review');
              }
              if (pr.state !== 'open' || pr.draft) {
                throw new Error('PR 在 Codex Review 期間已關閉或轉為 draft，停止自動合併');
              }
              if (pr.base.sha !== reviewedBaseSha || pr.base.ref !== reviewedBaseRef) {
                throw new Error('PR 在 Codex Review 期間 base 已改變，必須重新執行 CI 與 Review');
              }
              await validateReleaseRequest(pr);
              if (pr.mergeable_state === 'dirty') {
                throw new Error(`Release PR #${pr.number} 有合併衝突`);
              }

              await github.graphql(`
                mutation($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: $mergeMethod
                  }) {
                    pullRequest { number }
                  }
                }
              `, {
                pullRequestId: pr.node_id,
                mergeMethod: 'MERGE'
              });

              core.notice(`Release PR #${pr.number} 已啟用 Merge commit 自動合併`);
            }
