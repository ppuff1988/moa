name: Auto Version Bump
run-name: Prepare hotfix version for #${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

concurrency:
  group: hotfix-version-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump-hotfix:
    name: 在 Hotfix PR 分支寫入 patch 版本
    runs-on: ubuntu-latest
    if: >-
      !github.event.pull_request.draft &&
      startsWith(github.head_ref, 'hotfix/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      NPM_VERSION: '12.0.1'
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: 使用專案指定的 npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: 計算 main 的下一個 patch 版本
        id: version
        run: |
          git fetch origin main:refs/remotes/origin/main

          BASE_VERSION=$(git show origin/main:package.json | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => console.log(JSON.parse(input).version));")
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_VERSION=$(node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); console.log([major, minor, patch + 1].join('.'));" "$BASE_VERSION")

          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "expected_version=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT_VERSION" = "$EXPECTED_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Hotfix 已使用預期版本 v${EXPECTED_VERSION}"
            exit 0
          fi

          if [ "$CURRENT_VERSION" != "$BASE_VERSION" ]; then
            echo "Hotfix 版本 v${CURRENT_VERSION} 不是 main v${BASE_VERSION} 或預期 v${EXPECTED_VERSION}"
            exit 1
          fi

          npm version "$EXPECTED_VERSION" --no-git-tag-version
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 提交版本更新到 Hotfix 分支
        if: steps.version.outputs.changed == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.expected_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): bump hotfix version to v${EXPECTED_VERSION}"
          git push origin "HEAD:${HEAD_BRANCH}"
