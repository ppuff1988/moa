name: Auto Version Bump
run-name: Prepare hotfix version for #${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

concurrency:
  # 版本號是 repository-wide 資源；所有 hotfix 必須依序配置。
  group: hotfix-version-all
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  bump-hotfix:
    name: 在 Hotfix PR 分支寫入 patch 版本
    runs-on: ubuntu-latest
    if: >-
      !github.event.pull_request.draft &&
      startsWith(github.head_ref, 'hotfix/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      NPM_VERSION: '12.0.1'
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: 使用專案指定的 npm
        run: npm install --global "npm@${NPM_VERSION}"

      - name: 保留不重複的 Hotfix patch 版本
        id: version
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            const fs = require('fs');

            function parseVersion(version) {
              const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
              if (!match) throw new Error(`不支援的版本格式: ${version}`);
              return match.slice(1).map(Number);
            }

            async function getPackageVersion(ref) {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'package.json',
                ref
              });
              return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8')).version;
            }

            const currentPr = context.payload.pull_request;
            const baseVersion = await getPackageVersion(currentPr.base.sha);
            const currentVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const [baseMajor, baseMinor, basePatch] = parseVersion(baseVersion);

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              per_page: 100
            });

            const reservedVersions = [];
            for (const pull of openPulls) {
              if (
                pull.number === currentPr.number ||
                !pull.head.ref.startsWith('hotfix/') ||
                pull.head.repo?.full_name !== context.payload.repository.full_name
              ) continue;

              const version = await getPackageVersion(pull.head.sha);
              const [major, minor, patch] = parseVersion(version);
              if (major === baseMajor && minor === baseMinor && patch > basePatch) {
                reservedVersions.push(version);
              }
            }

            if (currentVersion !== baseVersion) {
              const [major, minor, patch] = parseVersion(currentVersion);
              const isValidReservation =
                major === baseMajor && minor === baseMinor && patch > basePatch;
              if (!isValidReservation || reservedVersions.includes(currentVersion)) {
                throw new Error(
                  `Hotfix 版本 v${currentVersion} 無效或已被其他開啟中的 PR 保留`
                );
              }

              core.setOutput('expected_version', currentVersion);
              core.setOutput('changed', 'false');
              core.notice(`Hotfix 已保留版本 v${currentVersion}`);
              return;
            }

            const reservedPatches = reservedVersions.map((version) => parseVersion(version)[2]);
            const nextPatch = Math.max(basePatch, ...reservedPatches) + 1;
            const expectedVersion = `${baseMajor}.${baseMinor}.${nextPatch}`;
            core.setOutput('expected_version', expectedVersion);
            core.setOutput('changed', 'true');
            core.notice(`為 PR #${currentPr.number} 保留版本 v${expectedVersion}`);

      - name: 寫入保留的 Hotfix 版本
        if: steps.version.outputs.changed == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.expected_version }}
        run: npm version "$EXPECTED_VERSION" --no-git-tag-version

      - name: 提交版本更新到 Hotfix 分支
        if: steps.version.outputs.changed == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.expected_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): bump hotfix version to v${EXPECTED_VERSION}"
          git push origin "HEAD:${HEAD_BRANCH}"
