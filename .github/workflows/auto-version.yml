name: Auto Version Bump

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_run:
    workflows: ['Auto Merge Hotfix']
    types: [completed]

concurrency:
  group: auto-version-main
  # Newer runs recompute every commit since the latest tag, so the latest main state wins.
  cancel-in-progress: true

jobs:
  guard-version-pr-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'chore/version-bump')
    steps:
      - name: 拒絕未合併的版本 PR 關閉事件
        if: github.event.pull_request.merged != true
        run: |
          echo "::error::版本升級 PR 未合併，不得觸發 release 或 main-to-dev sync"
          exit 1

  check-and-bump:
    runs-on: ubuntu-latest
    # 對於 PR 關閉事件：只在已合併到 main 時執行
    # 對於 Auto Merge Hotfix：只在成功完成且在 main 分支時執行
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_run' && 
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version_changed: ${{ steps.bump.outputs.version_changed }}
      new_version: ${{ steps.bump.outputs.new_version }}
      old_version: ${{ steps.bump.outputs.old_version }}
      bump_type: ${{ steps.bump.outputs.bump_type }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 分析 Commits 並自動升級版本
        id: bump
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "📦 當前版本: $CURRENT_VERSION"

          LAST_COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          if echo "$LAST_COMMIT_MSG" | grep -q "chore(release): bump version"; then
            echo "⏭️ 跳過版本升級 commit，避免無限循環"
            echo "version_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          LAST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)

          # 如果沒有 tag，使用所有提交記錄（適用於新倉庫）
          if [ -z "$LAST_TAG" ]; then
            # 獲取第一個提交的 hash
            FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD)
            COMMITS=$(git log ${FIRST_COMMIT}..HEAD --pretty=format:"%s" --no-merges)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s" --no-merges)
          fi

          if [ -z "$COMMITS" ]; then
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 沒有新的 commits"
            exit 0
          fi

          echo "$COMMITS"

          BUMP_TYPE="none"
          if echo "$COMMITS" | grep -qiE "BREAKING CHANGE|!:"; then
            BUMP_TYPE="major"
          elif echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
            BUMP_TYPE="minor"
          elif echo "$COMMITS" | grep -qiE "^(fix|chore|refactor|perf|test|build|ci|docs|style)(\(.+\))?:"; then
            BUMP_TYPE="patch"
          fi

          if [ "$BUMP_TYPE" = "none" ]; then
            echo "version_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          NEW_VERSION=$(npm version $BUMP_TYPE --no-git-tag-version | sed 's/v//')
          echo "old_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "version_changed=true" >> $GITHUB_OUTPUT
          echo "✅ 版本升級為: $NEW_VERSION"

      - name: 提交並建立版本升級 PR
        if: steps.bump.outputs.version_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          NEW_VERSION=${{ steps.bump.outputs.new_version }}
          BUMP_TYPE=${{ steps.bump.outputs.bump_type }}
          VERSION_BRANCH="chore/version-bump"
          PR_TITLE="chore(release): bump version to v${NEW_VERSION}"
          PR_BODY="Automated ${BUMP_TYPE} version bump from v${{ steps.bump.outputs.old_version }} to v${NEW_VERSION}. This PR will merge after the required checks pass."

          git switch -C "$VERSION_BRANCH"
          git add package.json package-lock.json || true
          git commit -m "$PR_TITLE" -m "Type: ${BUMP_TYPE}"

          # Fetch the automation-owned branch so force-with-lease can reject unexpected writes.
          git fetch origin "$VERSION_BRANCH:refs/remotes/origin/$VERSION_BRANCH" || true
          echo "📤 建立或更新版本分支..."
          git push --force-with-lease origin "HEAD:$VERSION_BRANCH"

          PR_URL=$(gh pr list \
            --base main \
            --head "$VERSION_BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url // empty')

          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "$VERSION_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY")
          else
            PR_NUMBER=$(gh pr view "$PR_URL" --json number --jq '.number')
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --method PATCH \
              --field title="$PR_TITLE" \
              --field body="$PR_BODY" >/dev/null
          fi

          # Auto-merge is safe only while main requires PR heads to be up to date.
          STRICT_CHECKS_REQUIRED=$(gh api \
            "repos/${GITHUB_REPOSITORY}/rules/branches/main" \
            --jq 'any(.[]; .type == "required_status_checks" and .parameters.strict_required_status_checks_policy == true)')
          AUTO_MERGE_ENABLED=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$STRICT_CHECKS_REQUIRED" != "true" ]; then
            if [ "$AUTO_MERGE_ENABLED" = "true" ]; then
              gh pr merge --disable-auto "$PR_URL"
            fi
            echo "::error::main 必須啟用 strict required status checks 才能自動合併版本 PR"
            exit 1
          fi

          if [ "$AUTO_MERGE_ENABLED" != "true" ]; then
            gh pr merge --auto --squash "$PR_URL"
          fi

          echo "✅ 版本升級 PR 已建立或更新: $PR_URL"
          echo "ℹ️ 較新的 main 變更會重新計算並更新同一個 PR"

  notify:
    name: 版本升級通知
    runs-on: ubuntu-latest
    needs: check-and-bump
    if: needs.check-and-bump.outputs.version_changed == 'true'
    steps:
      - name: 📣 發送版本升級通知
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            🚀 *版本自動升級*
            *專案:* `${{ github.repository }}`
            *版本:* `v${{ needs.check-and-bump.outputs.old_version }}` → `v${{ needs.check-and-bump.outputs.new_version }}`
            *類型:* `${{ needs.check-and-bump.outputs.bump_type }}`
            *合併者:* `${{ github.actor }}`
            [查看 Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
