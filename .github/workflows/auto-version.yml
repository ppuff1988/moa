name: Auto Version Bump
run-name: Reconcile release and hotfix version queue

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
    branches: [main]
  push:
    branches: [main, dev]
  issues:
    types: [labeled, reopened]
  workflow_dispatch:

concurrency:
  # Pending runs may be replaced by GitHub. All release intent lives in Issues and
  # all hotfix intent lives in PRs, so every surviving run can rebuild the queue.
  group: version-preparation
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  reconcile-version:
    name: 推進 Release／Hotfix 版本佇列
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'issues' &&
       contains(github.event.issue.labels.*.name, 'release-request')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (startsWith(github.event.pull_request.head.ref, 'hotfix/') ||
        startsWith(github.event.pull_request.head.ref, 'release/v')))
    env:
      NPM_VERSION: '12.0.1'
    steps:
      - name: 從 repository state 選取佇列首項
        id: queue
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            function parseVersion(version) {
              const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
              if (!match) throw new Error(`不支援的版本格式: ${version}`);
              return match.slice(1).map(Number);
            }

            function compareVersions(left, right) {
              for (let index = 0; index < left.length; index += 1) {
                if (left[index] !== right[index]) return left[index] - right[index];
              }
              return 0;
            }

            async function getPackageVersion(ref) {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'package.json',
                ref
              });
              return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8')).version;
            }

            async function authenticateReleaseRequest(issue) {
              const match = /<!-- moa-release-request bump=(auto|patch|minor|major) run_id=(\d+) -->/.exec(
                issue.body || ''
              );
              if (
                issue.pull_request ||
                issue.author_association !== 'OWNER' ||
                issue.user?.login !== context.repo.owner ||
                !match
              ) {
                return null;
              }

              try {
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: Number(match[2])
                });
                const trustedRun =
                  run.path === '.github/workflows/prepare-release.yml' &&
                  run.event === 'workflow_dispatch' &&
                  run.head_branch === 'main' &&
                  run.actor?.login === context.repo.owner;
                if (!trustedRun) return null;
                return { issue, match };
              } catch (error) {
                core.warning(`忽略無法驗證 workflow run 的 Release request #${issue.number}`);
                return null;
              }
            }

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              sort: 'created',
              direction: 'asc',
              per_page: 100
            });
            const sameRepository = (pull) =>
              pull.head.repo?.full_name === context.payload.repository.full_name;
            const trustedReleasePull = (pull) =>
              pull.head.ref.startsWith('release/v') &&
              sameRepository(pull) &&
              pull.author_association === 'OWNER' &&
              pull.user?.login === context.repo.owner;
            const releasePulls = openPulls.filter(
              (pull) => trustedReleasePull(pull)
            );

            const [requestIssues, { data: recentClosedPulls }] = await Promise.all([
              github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'release-request',
                sort: 'created',
                direction: 'asc',
                per_page: 100
              }),
              github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed',
                base: 'main',
                sort: 'updated',
                direction: 'desc',
                per_page: 100
              })
            ]);
            const validRequests = [];
            for (const issue of requestIssues) {
              const authenticated = await authenticateReleaseRequest(issue);
              if (authenticated) validRequests.push(authenticated);
            }
            const requestByNumber = new Map(
              validRequests.map((request) => [request.issue.number, request.issue])
            );
            const completedRequests = new Set();
            for (const pull of [...releasePulls, ...recentClosedPulls]) {
              if (!trustedReleasePull(pull)) continue;
              const requestNumber = Number(/(?:^|\n)- Request: #(\d+)(?:\n|$)/.exec(pull.body || '')?.[1]);
              if (!requestByNumber.has(requestNumber) || completedRequests.has(requestNumber)) continue;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: requestNumber,
                per_page: 100
              });
              const expectedPreparation = `Release commit \`${pull.head.sha}\` 已準備`;
              const hasPreparation = comments.some(
                (comment) =>
                  comment.author_association === 'OWNER' &&
                  (comment.body || '').includes(expectedPreparation)
              );
              if (!hasPreparation) {
                core.warning(`Release PR #${pull.number} 缺少可信的 commit 準備標記，略過恢復`);
                continue;
              }
              const expectedCompletion =
                `Release PR #${pull.number} 已建立：${pull.html_url}（commit \`${pull.head.sha}\`）`;
              const hasCompletion = comments.some(
                (comment) =>
                  comment.author_association === 'OWNER' &&
                  (comment.body || '').includes(expectedCompletion)
              );
              if (!hasCompletion) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: requestNumber,
                  body: expectedCompletion
                });
              }
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: requestNumber,
                state: 'closed'
              });
              completedRequests.add(requestNumber);
              core.notice(`Release request #${requestNumber} 已由 PR #${pull.number} 完成`);
            }

            if (releasePulls.length > 0) {
              const numbers = releasePulls.map((pull) => `#${pull.number}`).join(', ');
              core.notice(`等待 Release PR（${numbers}）完成後再推進版本佇列`);
              core.setOutput('has_work', 'false');
              return;
            }

            // Hotfix 優先於手動 Release，避免 Release 越過已開啟的緊急修復。
            const hotfixPulls = openPulls
              .filter((pull) => pull.head.ref.startsWith('hotfix/') && sameRepository(pull))
              .sort((left, right) => left.number - right.number);
            if (hotfixPulls.length > 0) {
              const selectedPr = hotfixPulls[0];
              if (selectedPr.draft) {
                core.notice(`Hotfix PR #${selectedPr.number} 尚為草稿，版本佇列暫停`);
                core.setOutput('has_work', 'false');
                return;
              }

              const [baseVersion, headVersion] = await Promise.all([
                getPackageVersion('main'),
                getPackageVersion(selectedPr.head.sha)
              ]);
              const [major, minor, patch] = parseVersion(baseVersion);
              const expectedVersion = `${major}.${minor}.${patch + 1}`;
              const headIsOlderOrEqual =
                compareVersions(parseVersion(headVersion), parseVersion(baseVersion)) <= 0;
              if (headVersion !== expectedVersion && !headIsOlderOrEqual) {
                throw new Error(
                  `Hotfix PR #${selectedPr.number} 的版本 v${headVersion} 無法由 main v${baseVersion} 推進`
                );
              }

              core.setOutput('has_work', 'true');
              core.setOutput('kind', 'hotfix');
              core.setOutput('checkout_ref', selectedPr.head.sha);
              core.setOutput('checkout_sha', selectedPr.head.sha);
              core.setOutput('branch', selectedPr.head.ref);
              core.setOutput('number', String(selectedPr.number));
              core.setOutput('base_version', baseVersion);
              core.setOutput('expected_version', expectedVersion);
              core.notice(
                `Hotfix 佇列目前處理 PR #${selectedPr.number}: ${selectedPr.head.ref} → v${expectedVersion}`
              );
              return;
            }

            const requests = validRequests.filter(
              (request) => !completedRequests.has(request.issue.number)
            );
            if (requests.length === 0) {
              core.notice('目前沒有等待中的 Release／Hotfix');
              core.setOutput('has_work', 'false');
              return;
            }

            const request = requests[0];
            const [{ data: dev }, { data: main }] = await Promise.all([
              github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'dev'
              }),
              github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main'
              })
            ]);
            core.setOutput('has_work', 'true');
            core.setOutput('kind', 'release');
            core.setOutput('checkout_ref', dev.commit.sha);
            core.setOutput('checkout_sha', dev.commit.sha);
            core.setOutput('main_sha', main.commit.sha);
            core.setOutput('issue_number', String(request.issue.number));
            core.setOutput('requested_bump', request.match[1]);
            core.notice(`Release request #${request.issue.number} 是目前版本佇列首項`);

      # 先在未進入 Hotfix checkout 的目錄準備固定工具鏈，避免分支內的
      # .npmrc 改寫 registry、cache 或 lifecycle script 行為。
      - uses: actions/setup-node@v6
        if: steps.queue.outputs.has_work == 'true'
        with:
          node-version: 24

      - name: 使用固定且隔離的 npm
        if: steps.queue.outputs.has_work == 'true'
        working-directory: ${{ runner.temp }}
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: >-
          npm install --global "npm@${NPM_VERSION}"
          --ignore-scripts --registry=https://registry.npmjs.org

      - uses: actions/checkout@v6
        if: steps.queue.outputs.has_work == 'true'
        with:
          ref: ${{ steps.queue.outputs.checkout_ref }}
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: 計算並寫入版本
        id: version
        if: steps.queue.outputs.has_work == 'true'
        env:
          KIND: ${{ steps.queue.outputs.kind }}
          BASE_VERSION: ${{ steps.queue.outputs.base_version }}
          EXPECTED_VERSION: ${{ steps.queue.outputs.expected_version }}
          REQUESTED_BUMP: ${{ steps.queue.outputs.requested_bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main

          if [ "$KIND" = "hotfix" ]; then
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git merge --no-edit origin/main
            fi

            CURRENT_VERSION=$(node -p "require('./package.json').version")
            if [ "$CURRENT_VERSION" != "$BASE_VERSION" ] && [ "$CURRENT_VERSION" != "$EXPECTED_VERSION" ]; then
              echo "main 或 Hotfix 在版本計算期間已有變更，交給下一次 reconcile"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$CURRENT_VERSION" = "$BASE_VERSION" ]; then
              npm version "$EXPECTED_VERSION" --no-git-tag-version --ignore-scripts
            fi
            {
              echo "ready=true"
              echo "new_version=$EXPECTED_VERSION"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo 'dev 尚未包含最新 main；等待 main → dev 同步完成後再處理此請求'
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          BUMP_TYPE="$REQUESTED_BUMP"
          if [ "$BUMP_TYPE" = "auto" ]; then
            LAST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
            if [ -n "$LAST_TAG" ]; then
              COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:'%s%n%b' --no-merges)
            else
              COMMITS=$(git log --pretty=format:'%s%n%b' --no-merges)
            fi

            if printf '%s\n' "$COMMITS" | grep -qiE 'BREAKING CHANGE|^[a-z]+(\(.+\))?!:'; then
              BUMP_TYPE="major"
            elif printf '%s\n' "$COMMITS" | grep -qiE '^feat(\(.+\))?:'; then
              BUMP_TYPE="minor"
            else
              BUMP_TYPE="patch"
            fi
          fi

          NEW_VERSION=$(npm version "$BUMP_TYPE" --no-git-tag-version --ignore-scripts | sed 's/^v//')
          {
            echo "ready=true"
            echo "old_version=$CURRENT_VERSION"
            echo "new_version=$NEW_VERSION"
            echo "bump_type=$BUMP_TYPE"
            echo "branch=release/v${NEW_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: 確認佇列首項與來源 SHA 未改變
        id: confirm
        if: steps.version.outputs.ready == 'true'
        uses: actions/github-script@v8
        env:
          KIND: ${{ steps.queue.outputs.kind }}
          SELECTED_NUMBER: ${{ steps.queue.outputs.number }}
          SELECTED_SHA: ${{ steps.queue.outputs.checkout_sha }}
          SELECTED_MAIN_SHA: ${{ steps.queue.outputs.main_sha }}
          REQUEST_ISSUE: ${{ steps.queue.outputs.issue_number }}
          REQUESTED_BUMP: ${{ steps.queue.outputs.requested_bump }}
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            async function authenticateReleaseRequest(issue) {
              const match = /<!-- moa-release-request bump=(auto|patch|minor|major) run_id=(\d+) -->/.exec(
                issue.body || ''
              );
              if (
                issue.pull_request ||
                issue.author_association !== 'OWNER' ||
                issue.user?.login !== context.repo.owner ||
                !match
              ) {
                return null;
              }

              try {
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: Number(match[2])
                });
                const trustedRun =
                  run.path === '.github/workflows/prepare-release.yml' &&
                  run.event === 'workflow_dispatch' &&
                  run.head_branch === 'main' &&
                  run.actor?.login === context.repo.owner;
                return trustedRun ? { issue, match } : null;
              } catch (error) {
                core.warning(`忽略無法驗證 workflow run 的 Release request #${issue.number}`);
                return null;
              }
            }

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              sort: 'created',
              direction: 'asc',
              per_page: 100
            });
            const sameRepository = (pull) =>
              pull.head.repo?.full_name === context.payload.repository.full_name;
            const trustedReleasePull = (pull) =>
              pull.head.ref.startsWith('release/v') &&
              sameRepository(pull) &&
              pull.author_association === 'OWNER' &&
              pull.user?.login === context.repo.owner;
            const releasePulls = openPulls.filter((pull) => trustedReleasePull(pull));
            const hotfixPulls = openPulls
              .filter((pull) => pull.head.ref.startsWith('hotfix/') && sameRepository(pull))
              .sort((left, right) => left.number - right.number);

            let current = false;
            if (process.env.KIND === 'hotfix') {
              const queueHead = hotfixPulls[0];
              current =
                releasePulls.length === 0 &&
                queueHead &&
                !queueHead.draft &&
                String(queueHead.number) === process.env.SELECTED_NUMBER &&
                queueHead.head.sha === process.env.SELECTED_SHA;
            } else {
              const [{ data: dev }, { data: main }, { data: issue }, requestIssues] = await Promise.all([
                github.rest.repos.getBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: 'dev'
                }),
                github.rest.repos.getBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: 'main'
                }),
                github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: Number(process.env.REQUEST_ISSUE)
                }),
                github.paginate(github.rest.issues.listForRepo, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  labels: 'release-request',
                  sort: 'created',
                  direction: 'asc',
                  per_page: 100
                })
              ]);
              const authenticatedRequests = [];
              for (const candidate of requestIssues) {
                const authenticated = await authenticateReleaseRequest(candidate);
                if (authenticated) authenticatedRequests.push(authenticated);
              }
              const queueHead = authenticatedRequests[0];
              const authenticatedIssue = await authenticateReleaseRequest(issue);
              current =
                releasePulls.length === 0 &&
                hotfixPulls.length === 0 &&
                String(queueHead?.issue.number) === process.env.REQUEST_ISSUE &&
                authenticatedIssue?.match[1] === process.env.REQUESTED_BUMP &&
                issue.state === 'open' &&
                issue.labels.some((label) => (label.name || label) === 'release-request') &&
                dev.commit.sha === process.env.SELECTED_SHA &&
                main.commit.sha === process.env.SELECTED_MAIN_SHA;
            }

            if (!current) {
              core.notice('目前工作已不是版本佇列首項；保留 repository state，交給下一次 reconcile');
              core.setOutput('proceed', 'false');
              return;
            }
            core.setOutput('proceed', 'true');

      - name: 提交並推送 Hotfix 版本
        if: steps.confirm.outputs.proceed == 'true' && steps.queue.outputs.kind == 'hotfix'
        env:
          EXPECTED_VERSION: ${{ steps.queue.outputs.expected_version }}
          HEAD_BRANCH: ${{ steps.queue.outputs.branch }}
        run: |
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump hotfix version to v${EXPECTED_VERSION}"
          fi
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: 提交到 Release 分支
        id: push_release
        if: steps.confirm.outputs.proceed == 'true' && steps.queue.outputs.kind == 'release'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
          SOURCE_SHA: ${{ steps.queue.outputs.checkout_sha }}
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/${RELEASE_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
            REMOTE_VERSION=$(git show "origin/${RELEASE_BRANCH}:package.json" | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => console.log(JSON.parse(input).version));")
            if [ "$REMOTE_VERSION" != "$NEW_VERSION" ] ||
              ! git merge-base --is-ancestor "$SOURCE_SHA" "origin/${RELEASE_BRANCH}" ||
              ! git diff --quiet "origin/${RELEASE_BRANCH}" -- .; then
              echo "既有 ${RELEASE_BRANCH} 並非目前請求建立的 Release 分支"
              exit 1
            fi
            RELEASE_SHA=$(git rev-parse "origin/${RELEASE_BRANCH}")
            echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
            echo "Release 分支 ${RELEASE_BRANCH} 已正確存在，繼續恢復 PR 建立流程"
            exit 0
          fi

          git switch -c "$RELEASE_BRANCH"
          git add package.json package-lock.json
          git commit -m "chore(release): bump version to v${NEW_VERSION}"
          git push origin "HEAD:refs/heads/${RELEASE_BRANCH}"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 建立 Release PR 並完成請求
        if: steps.push_release.outcome == 'success'
        uses: actions/github-script@v8
        env:
          OLD_VERSION: ${{ steps.version.outputs.old_version }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          BUMP_TYPE: ${{ steps.version.outputs.bump_type }}
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
          REQUEST_ISSUE: ${{ steps.queue.outputs.issue_number }}
          RELEASE_SHA: ${{ steps.push_release.outputs.release_sha }}
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            const requestNumber = Number(process.env.REQUEST_ISSUE);
            const requestComments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: requestNumber,
              per_page: 100
            });
            const expectedPreparation = `Release commit \`${process.env.RELEASE_SHA}\` 已準備`;
            const hasPreparation = requestComments.some(
              (comment) =>
                comment.author_association === 'OWNER' &&
                (comment.body || '').includes(expectedPreparation)
            );
            if (!hasPreparation) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: requestNumber,
                body: expectedPreparation
              });
            }

            const existingPulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              head: `${context.repo.owner}:${process.env.RELEASE_BRANCH}`,
              per_page: 100
            });
            let pr = existingPulls[0];
            if (
              pr &&
              (pr.author_association !== 'OWNER' || pr.user?.login !== context.repo.owner)
            ) {
              throw new Error(`既有 Release PR #${pr.number} 並非由 repository owner 建立`);
            }
            if (!pr) {
              ({ data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `chore(release): promote dev to main v${process.env.NEW_VERSION}`,
                head: process.env.RELEASE_BRANCH,
                base: 'main',
                body: [
                  '## Release',
                  '',
                  `- Source: \`dev\``,
                  `- Version: \`v${process.env.OLD_VERSION}\` → \`v${process.env.NEW_VERSION}\``,
                  `- Bump: \`${process.env.BUMP_TYPE}\``,
                  `- Request: #${process.env.REQUEST_ISSUE}`,
                  '',
                  'This PR will merge after all required checks and reviews pass.'
                ].join('\n')
              }));
            }
            if (pr.head.sha !== process.env.RELEASE_SHA) {
              throw new Error(`Release PR #${pr.number} 的 commit 與已準備版本不一致`);
            }

            const expectedCompletion =
              `Release PR #${pr.number} 已建立：${pr.html_url}（commit \`${process.env.RELEASE_SHA}\`）`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: requestNumber,
              body: expectedCompletion
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: requestNumber,
              state: 'closed'
            });
            core.notice(`Release PR #${pr.number}: ${pr.html_url}`);
