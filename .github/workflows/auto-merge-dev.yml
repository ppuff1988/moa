name: Auto Merge to Dev

on:
  workflow_run:
    workflows: ['CI Test']
    types:
      - completed

concurrency:
  group: auto-merge-dev-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    outputs:
      has_conflicts: ${{ steps.merge.outputs.has_conflicts }}
      conflict_pr_numbers: ${{ steps.merge.outputs.conflict_pr_numbers }}
    # 對所有成功的 PR CI run 啟動；script 再依 base=dev 過濾。
    # 這也會替非慣例命名的 PR 建立 required codex-review status。
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'

    steps:
      - name: 等待 Codex Review 並自動合併
        uses: actions/github-script@v8
        id: merge
        with:
          script: |
            const CODEX_BOT = 'chatgpt-codex-connector[bot]';
            const CODEX_SUMMARY_MARKER = 'codex-pull-request-review-summary';
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

            async function setCodexStatus(sha, state, description) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state,
                context: 'codex-review',
                description,
                target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/commit/${sha}`
              });
            }

            async function waitForCodexReview(pr) {
              const shortSha = pr.head.sha.slice(0, 7);
              const maxAttempts = 30;
              await setCodexStatus(pr.head.sha, 'pending', `等待 Codex Review (${shortSha})`);

              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                const [issueComments, reviews, reviewComments] = await Promise.all([
                  github.paginate(github.rest.issues.listComments, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    per_page: 100
                  }),
                  github.paginate(github.rest.pulls.listReviews, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    per_page: 100
                  }),
                  github.paginate(github.rest.pulls.listReviewComments, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    per_page: 100
                  })
                ]);

                const currentReviews = reviews.filter(
                  (review) => review.user?.login === CODEX_BOT && review.commit_id === pr.head.sha
                );
                const currentReviewIds = new Set(currentReviews.map((review) => review.id));
                const findings = reviewComments.filter(
                  (comment) =>
                    comment.user?.login === CODEX_BOT &&
                    currentReviewIds.has(comment.pull_request_review_id)
                );
                const completedSummary = issueComments.some((comment) => {
                  const body = comment.body || '';
                  return (
                    comment.user?.login === CODEX_BOT &&
                    body.includes(CODEX_SUMMARY_MARKER) &&
                    body.includes('✅ **Completed**') &&
                    body.includes(`\`${shortSha}\``)
                  );
                });

                if (findings.length > 0) {
                  await setCodexStatus(pr.head.sha, 'failure', `Codex 發現 ${findings.length} 個問題`);
                  throw new Error(
                    `Codex Review 在目前 commit ${shortSha} 發現問題，停止自動合併`
                  );
                }
                if (completedSummary) {
                  await setCodexStatus(pr.head.sha, 'success', `Codex Review 通過 (${shortSha})`);
                  return;
                }

                console.log(`等待 Codex Review (${attempt}/${maxAttempts})，commit ${shortSha}`);
                if (attempt < maxAttempts) await sleep(20_000);
              }

              await setCodexStatus(pr.head.sha, 'failure', `等待 Codex Review 逾時 (${shortSha})`);
              throw new Error(`等待 Codex Review 逾時，停止自動合併 commit ${shortSha}`);
            }

            let hasConflicts = false;
            let conflictPRNumbers = [];
            const associatedPRs = context.payload.workflow_run.pull_requests;

            if (!associatedPRs || associatedPRs.length === 0) {
              console.log('ℹ️ 此 workflow run 沒有關聯的 PR');
              return;
            }

            for (const associatedPR of associatedPRs) {
              // 獲取完整的 PR 資訊
              let { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: associatedPR.number
              });

              // 檢查 PR 是否符合條件 (目標是 dev, 非 draft)
              if (pr.base.ref !== 'dev' || pr.draft) {
                console.log(`⏭️ 跳過 PR #${pr.number}: 目標不是 dev 或是一個 draft`);
                continue;
              }

              if (pr.head.sha !== context.payload.workflow_run.head_sha) {
                throw new Error(
                  `PR #${pr.number} 的目前 commit 並非觸發此流程的 CI commit，等待新 CI`
                );
              }

              const sourceBranch = pr.head.ref;
              const targetBranch = pr.base.ref;

              console.log(`🔍 檢查 PR #${pr.number}: ${sourceBranch} → ${targetBranch}`);

              const reviewedSha = pr.head.sha;
              await waitForCodexReview(pr);

              ({ data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: associatedPR.number
              }));

              if (pr.head.sha !== reviewedSha) {
                throw new Error('PR 在 Codex Review 期間有新 commit，必須重新執行 CI 與 Review');
              }

              if (pr.mergeable_state === 'clean') {
                // 可以直接 merge
                const mergeMethod = sourceBranch === 'main' ? 'merge' : 'squash';
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  // main → dev 保留共同祖先；一般功能 PR 維持 squash。
                  merge_method: mergeMethod,
                  commit_title: pr.title,
                  commit_message: `${pr.body || ''}\n\nPR #${pr.number} - ${sourceBranch}`
                });

                console.log(`✅ PR #${pr.number} 已自動合併到 ${targetBranch} (${mergeMethod})`);

                // 自動刪除源分支（排除保護分支）
                const protectedBranches = ['main', 'dev', 'staging', 'production'];
                const shouldDelete = !protectedBranches.includes(sourceBranch);

                if (shouldDelete) {
                  try {
                    await github.rest.git.deleteRef({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: `heads/${sourceBranch}`
                    });
                    console.log(`🗑️ 已刪除分支: ${sourceBranch}`);
                  } catch (error) {
                    console.log(`⚠️ 刪除分支失敗: ${error.message}`);
                  }
                } else {
                  console.log(`🔒 保留分支 ${sourceBranch}（保護分支）`);
                }
              } else if (pr.mergeable_state === 'dirty') {
                console.log(`❌ PR #${pr.number} 有衝突，建立補救 PR`);
                hasConflicts = true;
                conflictPRNumbers.push(pr.number);

                // 建立唯一分支名稱
                const newBranch = `pr-${pr.number}-conflict-${pr.head.sha.slice(0,7)}`;

                try {
                  // 建立新分支
                  await github.rest.git.createRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `refs/heads/${newBranch}`,
                    sha: pr.head.sha
                  });

                  // 建立新的 PR
                  const newPr = await github.rest.pulls.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: `[CONFLICT] ${pr.title}`,
                    head: newBranch,
                    base: pr.base.ref,
                    body: `❌ 自動合併失敗，請手動處理衝突\n\n原始 PR: #${pr.number}\n合併狀態: ${pr.mergeable_state}\n\n${pr.body || ''}`
                  });

                  // 加上 label 標記
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: newPr.data.number,
                    labels: ['merge-conflict', 'needs-attention']
                  });

                  console.log(`📌 補救 PR 已建立: #${newPr.data.number}`);
                } catch (error) {
                  console.log(`⚠️ 建立補救 PR 失敗: ${error.message}`);
                }
              } else {
                throw new Error(
                  `PR #${pr.number} 合併狀態為 ${pr.mergeable_state}，不是 clean，停止自動合併`
                );
              }
            }

            // 輸出結果供後續步驟使用
            core.setOutput('has_conflicts', hasConflicts);
            core.setOutput('conflict_pr_numbers', conflictPRNumbers.join(','));

            if (hasConflicts) {
              console.log(`\n⚠️ 總共 ${conflictPRNumbers.length} 個 PR 有衝突: ${conflictPRNumbers.join(', ')}`);
            }

  notify:
    name: 合併通知
    runs-on: ubuntu-latest
    needs: auto-merge
    # 只在實際執行且有問題時通知（排除被跳過的情況）
    if: |
      always() &&
      needs.auto-merge.result != 'skipped' &&
      (needs.auto-merge.result == 'failure' || needs.auto-merge.outputs.has_conflicts == 'true')
    steps:
      - name: 📣 發送合併通知
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ${{ needs.auto-merge.outputs.has_conflicts == 'true' && '⚠️ *Auto Merge: 發現衝突*' || '❌ *Auto Merge to Dev 失敗*' }}

            *專案:* `${{ github.repository }}`
            *分支:* `${{ github.event.workflow_run.head_branch }} → dev`
            *觸發者:* `${{ github.event.workflow_run.actor.login }}`

            ${{ needs.auto-merge.outputs.has_conflicts == 'true' && format('⚠️ PR 有合併衝突，已建立補救 PR\n原始 PR: #{0}', needs.auto-merge.outputs.conflict_pr_numbers) || '❌ 自動合併失敗，請檢查錯誤' }}

            [立即查看](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
