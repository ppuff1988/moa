name: Auto Merge Hotfix

on:
  workflow_run:
    workflows: ['CI Test']
    types: [completed]

concurrency:
  group: auto-merge-hotfix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  auto-merge-hotfix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'hotfix/')
    steps:
      - name: 等待版本、Codex Review 並啟用 Hotfix 自動合併
        uses: actions/github-script@v8
        with:
          script: |
            const CODEX_BOT = 'chatgpt-codex-connector[bot]';
            const CODEX_SUMMARY_MARKER = 'codex-pull-request-review-summary';
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

            async function setCodexStatus(sha, state, description) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state,
                context: 'codex-review',
                description,
                target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/commit/${sha}`
              });
            }

            async function getPackageVersion(ref) {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'package.json',
                ref
              });
              return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8')).version;
            }

            async function waitForCodexReview(pr) {
              const shortSha = pr.head.sha.slice(0, 7);
              const maxAttempts = 30;
              await setCodexStatus(pr.head.sha, 'pending', `等待 Codex Review (${shortSha})`);

              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                const [issueComments, reviews, reviewComments] = await Promise.all([
                  github.paginate(github.rest.issues.listComments, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    per_page: 100
                  }),
                  github.paginate(github.rest.pulls.listReviews, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    per_page: 100
                  }),
                  github.paginate(github.rest.pulls.listReviewComments, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    per_page: 100
                  })
                ]);

                const currentReviews = reviews.filter(
                  (review) => review.user?.login === CODEX_BOT && review.commit_id === pr.head.sha
                );
                const currentReviewIds = new Set(currentReviews.map((review) => review.id));
                const findings = reviewComments.filter(
                  (comment) =>
                    comment.user?.login === CODEX_BOT &&
                    currentReviewIds.has(comment.pull_request_review_id)
                );
                const completedSummary = issueComments.some((comment) => {
                  const body = comment.body || '';
                  return (
                    comment.user?.login === CODEX_BOT &&
                    body.includes(CODEX_SUMMARY_MARKER) &&
                    body.includes('✅ **Completed**') &&
                    body.includes(`\`${shortSha}\``)
                  );
                });

                if (findings.length > 0) {
                  await setCodexStatus(pr.head.sha, 'failure', `Codex 發現 ${findings.length} 個問題`);
                  throw new Error(`Codex Review 在 commit ${shortSha} 發現問題，停止自動合併`);
                }
                if (completedSummary) {
                  await setCodexStatus(pr.head.sha, 'success', `Codex Review 通過 (${shortSha})`);
                  return;
                }

                core.info(`等待 Codex Review (${attempt}/${maxAttempts})，commit ${shortSha}`);
                if (attempt < maxAttempts) await sleep(20_000);
              }

              await setCodexStatus(pr.head.sha, 'failure', `等待 Codex Review 逾時 (${shortSha})`);
              throw new Error(`等待 Codex Review 逾時，停止自動合併 commit ${shortSha}`);
            }

            const associatedPRs = context.payload.workflow_run.pull_requests || [];
            for (const associatedPR of associatedPRs) {
              let { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: associatedPR.number
              });

              if (!pr.head.ref.startsWith('hotfix/') || pr.base.ref !== 'main' || pr.draft) continue;

              if (pr.head.sha !== context.payload.workflow_run.head_sha) {
                throw new Error(
                  `Hotfix PR #${pr.number} 的目前 commit 並非觸發此流程的 CI commit`
                );
              }

              const openPulls = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                base: 'main',
                per_page: 100
              });
              const hotfixPulls = openPulls
                .filter(
                  (pull) =>
                    !pull.draft &&
                    pull.head.ref.startsWith('hotfix/') &&
                    pull.head.repo?.full_name === context.payload.repository.full_name
                )
                .sort((left, right) => left.number - right.number);
              const queueHead = hotfixPulls[0];
              if (!queueHead || queueHead.number !== pr.number) {
                core.notice(`Hotfix PR #${pr.number} 尚未輪到，等待前面的 Hotfix 完成`);
                continue;
              }

              const [baseVersion, headVersion] = await Promise.all([
                getPackageVersion(pr.base.sha),
                getPackageVersion(pr.head.sha)
              ]);

              if (headVersion === baseVersion) {
                core.notice(`Hotfix PR #${pr.number} 尚未完成版本 bump，等待下一次 CI`);
                continue;
              }

              const [major, minor, patch] = baseVersion.split('.').map(Number);
              const expectedVersion = [major, minor, patch + 1].join('.');
              if (headVersion !== expectedVersion) {
                throw new Error(
                  `Hotfix PR #${pr.number} 版本應為 v${expectedVersion}，目前為 v${headVersion}`
                );
              }

              const reviewedSha = pr.head.sha;
              await waitForCodexReview(pr);

              ({ data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              }));

              if (pr.head.sha !== reviewedSha) {
                throw new Error('PR 在 Codex Review 期間有新 commit，必須重新執行 CI 與 Review');
              }
              if (pr.mergeable_state === 'dirty') {
                throw new Error(`Hotfix PR #${pr.number} 有合併衝突`);
              }

              await github.graphql(`
                mutation($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: $mergeMethod
                  }) {
                    pullRequest { number }
                  }
                }
              `, {
                pullRequestId: pr.node_id,
                mergeMethod: 'MERGE'
              });

              core.notice(`Hotfix PR #${pr.number} 已啟用 Merge commit 自動合併`);
            }

  notify:
    name: Hotfix 自動合併通知
    runs-on: ubuntu-latest
    needs: auto-merge-hotfix
    if: always() && needs.auto-merge-hotfix.result != 'skipped'
    steps:
      - uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ${{ needs.auto-merge-hotfix.result == 'success' && '🚨 *Hotfix 已通過自動合併檢查*' || '❌ *Hotfix 自動合併失敗*' }}

            *專案:* `${{ github.repository }}`
            *分支:* `${{ github.event.workflow_run.head_branch }} → main`
            [查看詳情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
