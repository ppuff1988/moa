name: CI Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

# GitHub concurrency 只保留一個 pending run，因此每次都從已合併 PR 重建狀態，
# 並在成功後再 dispatch 一次；任一 pending scanner 都能接續同一條佇列。
concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select-release:
    name: 選取最舊的未發布版本
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_release: ${{ steps.release.outputs.has_release }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      version: ${{ steps.release.outputs.version }}
      pull_number: ${{ steps.release.outputs.pull_number }}
      source_branch: ${{ steps.release.outputs.source_branch }}
    steps:
      - name: 從 main 的合併紀錄重建發布佇列
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName === 'workflow_dispatch' && context.ref !== 'refs/heads/main') {
              throw new Error('手動 CI Release 只能從 main 分支執行');
            }

            async function getPackageVersion(ref) {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'package.json',
                ref
              });
              const version = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8')).version;
              if (!/^\d+\.\d+\.\d+$/.test(version)) {
                throw new Error(`不支援的正式版本格式: ${version}`);
              }
              return version;
            }

            function compareVersions(left, right) {
              const leftParts = left.split('.').map(Number);
              const rightParts = right.split('.').map(Number);
              for (let index = 0; index < leftParts.length; index += 1) {
                if (leftParts[index] !== rightParts[index]) {
                  return leftParts[index] - rightParts[index];
                }
              }
              return 0;
            }

            async function resolveTagCommit(version) {
              let object;
              try {
                const response = await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/v${version}`
                });
                object = response.data.object;
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }

              while (object.type === 'tag') {
                const response = await github.rest.git.getTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_sha: object.sha
                });
                object = response.data.object;
              }
              return object.sha;
            }

            const [closedPulls, publishedReleases] = await Promise.all([
              github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed',
                base: 'main',
                per_page: 100
              }),
              github.paginate(github.rest.repos.listReleases, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              })
            ]);
            const publishedVersions = publishedReleases
              .filter((release) => !release.draft && /^v\d+\.\d+\.\d+$/.test(release.tag_name))
              .map((release) => release.tag_name.slice(1));
            const latestPublishedVersion = publishedVersions.sort(compareVersions).at(-1) || '0.0.0';
            const publishedVersionSet = new Set(publishedVersions);
            core.info(`目前最高已發布正式版: v${latestPublishedVersion}`);

            const mergedVersionPulls = closedPulls
              .filter(
                (pull) =>
                  pull.merged_at &&
                  pull.merge_commit_sha &&
                  pull.head.repo?.full_name === context.payload.repository.full_name &&
                  (pull.head.ref.startsWith('release/v') || pull.head.ref.startsWith('hotfix/'))
              )
              .sort((left, right) => new Date(left.merged_at) - new Date(right.merged_at));

            const seenVersions = new Map();
            const pendingReleases = [];
            for (const pull of mergedVersionPulls) {
              const version = await getPackageVersion(pull.merge_commit_sha);
              if (pull.head.ref.startsWith('release/v') && pull.head.ref !== `release/v${version}`) {
                throw new Error(`Release PR #${pull.number} 的 branch 與版本 v${version} 不一致`);
              }

              // 舊版歷史可能有 Release 缺口；絕不為低於目前正式版的缺口重新部署。
              if (
                publishedVersionSet.has(version) ||
                compareVersions(version, latestPublishedVersion) <= 0
              ) {
                continue;
              }

              const previousPull = seenVersions.get(version);
              if (previousPull && previousPull !== pull.number) {
                throw new Error(`PR #${previousPull} 與 #${pull.number} 重複使用版本 v${version}`);
              }
              seenVersions.set(version, pull.number);

              pendingReleases.push({ pull, version });
            }

            if (pendingReleases.length === 0) {
              core.setOutput('has_release', 'false');
              core.notice('main 目前沒有尚未完成發布的版本化 PR');
              return;
            }

            // A later Hotfix contains every earlier main merge and must be able
            // to recover production even when an older Release/Hotfix cannot
            // finish. Only skip entries after GitHub proves commit ancestry and
            // the Hotfix version strictly advances each superseded candidate.
            const latestHotfixIndex = pendingReleases.findLastIndex(({ pull }) =>
              pull.head.ref.startsWith('hotfix/')
            );
            let selectedIndex = 0;
            if (latestHotfixIndex > 0) {
              const selectedHotfix = pendingReleases[latestHotfixIndex];
              for (const superseded of pendingReleases.slice(0, latestHotfixIndex)) {
                const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  basehead: `${superseded.pull.merge_commit_sha}...${selectedHotfix.pull.merge_commit_sha}`
                });
                if (
                  !['ahead', 'identical'].includes(comparison.status) ||
                  compareVersions(selectedHotfix.version, superseded.version) <= 0
                ) {
                  throw new Error(
                    `Hotfix PR #${selectedHotfix.pull.number} 無法安全 supersede PR #${superseded.pull.number}`
                  );
                }
              }
              selectedIndex = latestHotfixIndex;
              const skipped = pendingReleases
                .slice(0, latestHotfixIndex)
                .map(({ pull, version }) => `#${pull.number} v${version}`)
                .join(', ');
              core.warning(
                `Hotfix PR #${selectedHotfix.pull.number} v${selectedHotfix.version} supersede: ${skipped}`
              );
            }

            const selectedRelease = pendingReleases[selectedIndex];
            const { pull, version } = selectedRelease;

            const tagCommit = await resolveTagCommit(version);
            if (tagCommit && tagCommit !== pull.merge_commit_sha) {
              throw new Error(
                `既有 tag v${version} 指向 ${tagCommit}，不能以 PR #${pull.number} 的 ${pull.merge_commit_sha} 覆寫 image`
              );
            }

            core.setOutput('has_release', 'true');
            core.setOutput('release_sha', pull.merge_commit_sha);
            core.setOutput('version', version);
            core.setOutput('pull_number', String(pull.number));
            core.setOutput('source_branch', pull.head.ref);
            core.notice(`下一個發布項目: PR #${pull.number} v${version} (${pull.merge_commit_sha})`);

  build-docker:
    name: 建置不可變 Docker 映像
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    needs: select-release
    if: needs.select-release.outputs.has_release == 'true'
    env:
      RELEASE_SHA: ${{ needs.select-release.outputs.release_sha }}
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 顯示發布來源
        run: |
          echo "發布 PR #${{ needs.select-release.outputs.pull_number }}"
          echo "來源分支: ${{ needs.select-release.outputs.source_branch }}"
          echo "固定 commit: $RELEASE_SHA"

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.select-release.outputs.release_sha }}

      - name: 驗證版本
        id: version
        env:
          EXPECTED_VERSION: ${{ needs.select-release.outputs.version }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$EXPECTED_VERSION" ]; then
            echo "選定版本 v${EXPECTED_VERSION} 與 commit 內容 v${VERSION} 不一致"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 建置並推送 App image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/moa:latest
            ${{ secrets.DOCKER_USERNAME }}/moa:v${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/moa:${{ env.RELEASE_SHA }}
          build-args: DATABASE_URL=postgres://dummy:dummy@localhost:5432/dummy
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/moa:latest
          cache-to: type=inline
          platforms: linux/amd64,linux/arm64

      - name: 建置並推送 Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/moa:worker
            ${{ secrets.DOCKER_USERNAME }}/moa:worker-v${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/moa:worker-${{ env.RELEASE_SHA }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/moa:worker
          cache-to: type=inline
          platforms: linux/amd64,linux/arm64

  prepare-tag:
    name: 建立或驗證版本標籤
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [select-release, build-docker]
    if: needs.build-docker.result == 'success'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.select-release.outputs.release_sha }}
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: 建立冪等版本標籤
        id: tag
        env:
          RELEASE_SHA: ${{ needs.select-release.outputs.release_sha }}
          VERSION: ${{ needs.build-docker.outputs.version }}
        run: |
          TAG="v${VERSION}"
          git fetch --tags --force

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_COMMIT" != "$RELEASE_SHA" ]; then
              echo "tagCommit !== releaseSha: $TAG 指向 $TAG_COMMIT，但發布 commit 是 $RELEASE_SHA"
              exit 1
            fi
            echo "$TAG 已存在且指向正確 commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$RELEASE_SHA" -m "Release $TAG" -m "Commit: $RELEASE_SHA"
            git push origin "$TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: 部署已建置版本
    needs: [select-release, build-docker, prepare-tag]
    if: needs.prepare-tag.result == 'success'
    uses: ./.github/workflows/cd.yml
    with:
      version: ${{ needs.build-docker.outputs.version }}
      release_sha: ${{ needs.select-release.outputs.release_sha }}
    secrets: inherit

  create-release:
    name: 標記發布完成
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    needs: [select-release, build-docker, prepare-tag, deploy-production]
    if: needs.deploy-production.result == 'success'
    permissions:
      contents: write
    steps:
      - name: 建立冪等 GitHub Release
        uses: actions/github-script@v8
        env:
          VERSION: ${{ needs.build-docker.outputs.version }}
          RELEASE_SHA: ${{ needs.select-release.outputs.release_sha }}
          TAG: ${{ needs.prepare-tag.outputs.tag }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        with:
          script: |
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.TAG
              });
              core.notice(`GitHub Release 已存在: ${existing.data.html_url}`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const body = [
              `**Commit:** ${process.env.RELEASE_SHA}`,
              '',
              '### Docker Images',
              `- \`${process.env.DOCKER_USERNAME}/moa:v${process.env.VERSION}\``,
              `- \`${process.env.DOCKER_USERNAME}/moa:${process.env.RELEASE_SHA}\``,
              `- \`${process.env.DOCKER_USERNAME}/moa:worker-v${process.env.VERSION}\``
            ].join('\n');

            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TAG,
              target_commitish: process.env.RELEASE_SHA,
              name: `Release ${process.env.TAG}`,
              body,
              draft: false,
              prerelease: false,
              generate_release_notes: true
            });
            core.notice(`GitHub Release 已建立: ${release.data.html_url}`);

  notify:
    name: 發布通知
    runs-on: ubuntu-latest
    needs: [select-release, build-docker, prepare-tag, deploy-production, create-release]
    if: always() && needs.select-release.outputs.has_release == 'true'
    steps:
      - uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1 # v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ${{ needs.create-release.result == 'success' && '🎉 *版本發布與部署完成*' || '❌ *版本發布流程失敗*' }}

            *版本:* `v${{ needs.select-release.outputs.version }}`
            *Commit:* `${{ needs.select-release.outputs.release_sha }}`
            *PR:* `#${{ needs.select-release.outputs.pull_number }}`
            [查看詳情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  continue-release-queue:
    name: 繼續下一個未發布版本
    runs-on: ubuntu-latest
    needs: [select-release, create-release]
    if: needs.create-release.result == 'success'
    steps:
      - name: 重新掃描發布佇列
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci-release.yml',
              ref: 'main'
            });
            core.notice('已排程下一次 main 發布佇列掃描');
